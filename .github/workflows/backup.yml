name: Backup

# Off-site copy on top of the database's own backups: a nightly encrypted dump kept for 14 days.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_BACKUP_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Install pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Dump and encrypt
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          FLY_DB_APP: ${{ vars.FLY_DB_APP }}
        run: |
          flyctl proxy 15432:5432 -a "$FLY_DB_APP" &
          for i in $(seq 1 30); do pg_isready -h localhost -p 15432 && break; sleep 1; done
          mkdir -p out
          /usr/lib/postgresql/17/bin/pg_dump "$BACKUP_DATABASE_URL" --format=custom --no-owner \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase-fd 3 3<<<"$BACKUP_PASSPHRASE" \
                  -o "out/coinfidant-$(date -u +%Y%m%dT%H%MZ).dump.gpg"
          test -s out/*.gpg
      - uses: actions/upload-artifact@v4
        with:
          name: coinfidant-backup-${{ github.run_id }}
          path: out/*.gpg
          retention-days: 14
          if-no-files-found: error
