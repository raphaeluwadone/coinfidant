# Fly.io config. Set `app` to your app's name; secrets are listed in docs/deploy.md.
app = "coinfidant"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Creates the app role if needed, then migrates, before any new machine takes traffic.
  release_command = "node dist/release.js"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # The evening check-in runs in-process, so one machine stays up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
